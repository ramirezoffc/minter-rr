name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    name: ${{ matrix.os }} · ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [minter-core, minter-desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux' && matrix.package == 'minter-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check ${{ matrix.package }}
        run: cargo check -p ${{ matrix.package }} --all-targets

      - name: Clippy ${{ matrix.package }}
        run: cargo clippy -p ${{ matrix.package }} --all-targets -- -D warnings

      - name: Test ${{ matrix.package }}
        run: cargo test -p ${{ matrix.package }} --lib

  windows-packaging:
    name: Windows · NSIS and portable packages
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/minter-desktop/package-lock.json

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Tauri CLI
        working-directory: crates/minter-desktop
        run: npm ci

      - name: Check PowerShell packaging syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($script in @(
            "scripts/package-windows-portable.ps1",
            "scripts/package-public.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script has PowerShell parser errors: $($errors -join '; ')"
            }
          }

      - name: Validate Windows packaging configuration
        working-directory: crates/minter-desktop
        run: npm run verify:windows-packaging

      - name: Build unsigned NSIS installer
        working-directory: crates/minter-desktop
        run: npm run build:windows

      - name: Verify NSIS artifact
        shell: pwsh
        run: |
          $config = Get-Content -Raw crates/minter-desktop/src-tauri/tauri.conf.json | ConvertFrom-Json
          $expectedName = "{0}_{1}_x64-setup.exe" -f $config.productName, $config.version
          $expectedPath = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\bundle\nsis\$expectedName"
          if (-not (Test-Path -LiteralPath $expectedPath -PathType Leaf)) {
            Get-ChildItem -Path target -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "Found installer candidate: $($_.FullName)" }
            throw "Expected NSIS installer was not created: $expectedPath"
          }
          Write-Host "Verified NSIS installer: $expectedPath"

      - name: Build and verify portable archive
        working-directory: crates/minter-desktop
        run: npm run package:windows:portable

  linux-deployment-scripts:
    name: bash syntax · Linux deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shell syntax
        run: bash -n deploy/linux/*.sh deploy/linux/tests/*.sh scripts/*.sh scripts/tests/*.sh

      - name: Test installer release selector
        run: bash deploy/linux/tests/install-version.sh

      - name: Test VPS runtime configuration
        run: bash deploy/linux/tests/vps-runtime-config.sh

      - name: Validate release metadata
        run: |
          node scripts/verify-release-metadata.mjs
          node scripts/verify-release-workflow.mjs

      - name: Test release packaging helpers
        run: bash scripts/tests/release-packaging.sh
