name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    name: ${{ matrix.os }} · ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package: [minter-core, minter-desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux' && matrix.package == 'minter-desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check ${{ matrix.package }}
        run: cargo check -p ${{ matrix.package }} --all-targets

      - name: Clippy ${{ matrix.package }}
        run: cargo clippy -p ${{ matrix.package }} --all-targets -- -D warnings

      - name: Test ${{ matrix.package }}
        run: cargo test -p ${{ matrix.package }} --lib

  linux-deployment-scripts:
    name: bash syntax · Linux deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n deploy/linux/install.sh deploy/linux/install-built.sh deploy/linux/start-minter-vnc.sh deploy/linux/tests/install-version.sh

      - name: Test installer release selector
        run: bash deploy/linux/tests/install-version.sh
