name: Windows and VPS beta release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      expected_tag: ${{ steps.release.outputs.expected_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      windows_setup: ${{ steps.release.outputs.windows_setup }}
      windows_portable: ${{ steps.release.outputs.windows_portable }}
      linux_vps: ${{ steps.release.outputs.linux_vps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project version and release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/verify-release-metadata.mjs --github-output

  windows:
    name: Windows x64 packages
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/minter-desktop/package-lock.json

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: crates/minter-desktop
        run: npm ci

      - name: Validate Windows packaging configuration
        working-directory: crates/minter-desktop
        run: npm run verify:windows-packaging

      - name: Build unsigned NSIS installer
        working-directory: crates/minter-desktop
        run: npm run build:windows

      - name: Build portable archive
        working-directory: crates/minter-desktop
        run: npm run package:windows:portable

      - name: Stage and validate Windows release assets
        shell: pwsh
        env:
          SETUP_NAME: ${{ needs.metadata.outputs.windows_setup }}
          PORTABLE_NAME: ${{ needs.metadata.outputs.windows_portable }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $installer = Join-Path $env:GITHUB_WORKSPACE "target\x86_64-pc-windows-msvc\release\bundle\nsis\$env:SETUP_NAME"
          $portable = Join-Path $env:GITHUB_WORKSPACE "dist\windows\$env:PORTABLE_NAME"
          foreach ($asset in @($installer, $portable)) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected Windows release asset was not created: $asset"
            }
          }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($portable)
          try {
            $members = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($members.Count -ne 1 -or $members[0] -ne "MINTER.exe") {
              throw "Portable archive must contain only MINTER.exe; found: $($members -join ', ')"
            }
          } finally {
            $zip.Dispose()
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\release-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $stage $env:SETUP_NAME)
          Copy-Item -LiteralPath $portable -Destination (Join-Path $stage $env:PORTABLE_NAME)

          $staged = @(Get-ChildItem -LiteralPath $stage -File)
          if ($staged.Count -ne 2) {
            throw "Windows release staging must contain exactly two files"
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.run_id }}
          path: dist/release-windows/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux VPS x64 package
    needs: metadata
    # Keep the glibc 2.34 build floor so the artifact works on Ubuntu 22.04+
    # as promised by deploy/linux/install.sh. ubuntu-latest would raise it.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build production binary
        run: cargo build -p minter-desktop --release

      - name: Locate and package Linux VPS binary
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          binary=""
          for candidate in \
            target/release/minter-desktop \
            crates/minter-desktop/src-tauri/target/release/minter-desktop; do
            if [ -x "$candidate" ]; then
              binary="$candidate"
              break
            fi
          done
          [ -n "$binary" ] || { echo "minter-desktop not found after build" >&2; exit 1; }
          bash scripts/package-linux-vps.sh "$RELEASE_VERSION" "$binary" dist/release-linux

          echo "Highest glibc symbols required:"
          objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

      - name: Upload Linux VPS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.run_id }}
          path: dist/release-linux/*
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Finalize release candidate
    needs: [metadata, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.run_id }}
          path: dist
          merge-multiple: true

      - name: Validate names and generate SHA256SUMS.txt
        run: bash scripts/finalize-release-assets.sh "${{ needs.metadata.outputs.version }}" dist

      - name: Upload consolidated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ needs.metadata.outputs.version }}-${{ github.run_id }}
          path: |
            dist/${{ needs.metadata.outputs.windows_setup }}
            dist/${{ needs.metadata.outputs.windows_portable }}
            dist/${{ needs.metadata.outputs.linux_vps }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub prerelease
    needs: [metadata, finalize]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release files
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.metadata.outputs.version }}-${{ github.run_id }}
          path: dist

      - name: Verify checksums before publication
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            release create "$GITHUB_REF_NAME"
            dist/MINTER_${RELEASE_VERSION}_x64-setup.exe
            dist/MINTER_${RELEASE_VERSION}_x64-portable.zip
            dist/MINTER_${RELEASE_VERSION}_linux-vps-x64.tar.gz
            dist/SHA256SUMS.txt
            --verify-tag
            --generate-notes
            --title "MINTER $GITHUB_REF_NAME"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
